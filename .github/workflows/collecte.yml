name: Collecte des offres CSP

# Tous les matins : collecte des offres de la veille,
# enregistrées dans data/AAAA-MM-JJ.json et data/latest.json.
# La tâche Claude planifiée de 8h10 lit data/latest.json (et relance la collecte si elle manque).
#
# GitHub peut retarder ou sauter un déclenchement planifié, surtout à l'heure pile
# (le créneau de 4h00 UTC a été sauté le 17/11/2026). D'où trois créneaux décalés :
# les deux derniers ne font rien si la collecte du jour est déjà enregistrée.
# Heures de Paris : hiver / été.

on:
  schedule:
    - cron: "47 3 * * *"   # 4h47 / 5h47
    - cron: "37 4 * * *"   # 5h37 / 6h37 (rattrapage)
    - cron: "29 5 * * *"   # 6h29 / 7h29 (rattrapage)
  workflow_dispatch:
    inputs:
      since:
        description: "Début de la fenêtre (AAAA-MM-JJ), vide = automatique"
        required: false
      until:
        description: "Fin de la fenêtre (AAAA-MM-JJ), vide = automatique"
        required: false
      debug:
        description: "Sauvegarder le HTML brut dans debug/ (true/false)"
        required: false
        default: "false"
  # Lancement d'essai : modifier run/demande.yml et pousser.
  push:
    branches: [main]
    paths: ["run/demande.yml"]

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Collecte du jour déjà faite ?
        id: deja
        run: |
          J=$(TZ=Europe/Paris date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$J.json" ]; then
            echo "Collecte du $J déjà enregistrée : créneau de rattrapage inutile."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.deja.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: steps.deja.outputs.skip != 'true'
        run: pip install -q -r requirements.txt

      - name: Paramètres
        if: steps.deja.outputs.skip != 'true'
        id: p
        run: |
          SINCE="${{ github.event.inputs.since }}"
          UNTIL="${{ github.event.inputs.until }}"
          DEBUG="${{ github.event.inputs.debug }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            SINCE=$(python -c "import yaml;print(yaml.safe_load(open('run/demande.yml')).get('since') or '')")
            UNTIL=$(python -c "import yaml;print(yaml.safe_load(open('run/demande.yml')).get('until') or '')")
            DEBUG=$(python -c "import yaml;print(str(yaml.safe_load(open('run/demande.yml')).get('debug', False)).lower())")
          fi
          ARGS=""
          [ -n "$SINCE" ] && ARGS="$ARGS --since $SINCE"
          [ -n "$UNTIL" ] && ARGS="$ARGS --until $UNTIL"
          [ "$DEBUG" = "true" ] && ARGS="$ARGS --debug"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Collecter
        if: steps.deja.outputs.skip != 'true'
        run: python scripts/collect.py ${{ steps.p.outputs.args }} 2>&1 | tee collecte.log

      - name: Enregistrer les résultats
        if: always() && steps.deja.outputs.skip != 'true'
        run: |
          mkdir -p logs && cp collecte.log "logs/derniere-collecte.log" || true
          git config user.name "veille-emploi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for d in data logs debug; do [ -e "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -q -m "Collecte du $(TZ=Europe/Paris date +%F)"
          for i in 1 2 3; do
            if git pull --rebase && git push; then echo "Résultats enregistrés"; exit 0; fi
            echo "Échec de l'envoi (essai $i)"; sleep 5
          done
          exit 1
